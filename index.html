  <main>
    <h1 class="visually-hidden">Фотографии</h1>

    <!-- Галерея: masonry. Порядок фото = порядок съёмки, можно менять местами.
         Фото идут группами по три портрета, квадратное и горизонтальное — в конце:
         так колонки получаются одной высоты.
         Каждое фото — в <picture>: сверху лёгкая WebP-версия (assets/images/webp/),
         под ней — оригинал jpg как запаска для старых браузеров.
         Первое картинка грузится сразу   (eager), остальные — по мере скролла (lazy).
         При добавлении нового фото: ширина ~1000px, quality ~80. -->
    <section class="gallery container" aria-label="Галерея фотографий">

      <figure class="gallery__item reveal">
        <picture>
          <source srcset="assets/images/webp/Masha-11.webp" type="image/webp">
          <img src="assets/images/Masha-11.jpeg" alt="Портрет — Masha" width="1667" height="2500" loading="eager" fetchpriority="high" decoding="async">
        </picture>
      </figure>

      <figure class="gallery__item reveal">
        <picture>
          <source srcset="assets/images/webp/Sasha-01.webp" type="image/webp">
          <img src="assets/images/Sasha-01.jpg" alt="Портрет — Sasha" width="1667" height="2500" loading="lazy" decoding="async">
        </picture>
      </figure>

      <figure class="gallery__item reveal">
